.pill[data-status=fading]{--dot:var(--color-red)}
#slotA b{color:var(--color-panel)}
#slotB b{color:var(--color-text)}
.bars{max-width:100%}
.bars rect.w{fill:var(--color-tint)}
#loading,#caption{color:var(--color-panel);text-shadow:0 1px 3px var(--color-map)}
#loading .bar i{background:var(--color-panel)}
#colourBox label:has(input:focus-visible){outline:2px solid var(--color-violet);outline-offset:2px}
@media (max-width:1499px){
  header{padding:0;gap:0}
  header .hrow{gap:8px}
  #winLabel{min-width:80px}
  #colourBox label{background:#fff;border:1px solid #c9cbd0;border-radius:8px;font-size:13px;line-height:18px;padding:2px 6px}
  #colourBox label:has(input:checked){background:var(--color-text);color:var(--color-panel)}
  #compareBox{gap:4px} #compareBox .slot{gap:4px}
  #inspTop{padding:0 8px;gap:4px}
}
@media (max-width:1199px){
  #insp{right:12px;top:84px;bottom:12px;margin-left:0;transform:translateX(calc(100% + 12px));border:0}
  #hrow2{gap:4px} #winLabel{min-width:0;flex-basis:0}
  #levelBox button{padding:2px 4px} #colourBox label{padding:1px 3px}
}
@media (prefers-reduced-motion: reduce){.prog{animation:none;background:var(--color-text)}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hrow" id="hrow1">
    <span id="hname">undercurrent</span>
    <span class="seg" id="qswitch" role="group" aria-label="Question">
      <button id="q1" data-act="preset" data-p="1" aria-pressed="true">What is arriving</button><button id="q2" data-act="preset" data-p="2" aria-pressed="false">How topics connect</button>
    </span>
    <span id="status">server: <span id="statusHost"></span> <span id="statusDot">●</span></span>
  </div>
  <div class="hrow" id="hrow2">
    <details id="winDD" class="dd">
      <summary role="button" aria-haspopup="menu"><span id="winSum" style="border:1px solid var(--color-border);border-radius:6px;padding:3px 8px;font-size:12px;display:inline-block">last 6 months ▾</span></summary>
      <div role="menu" style="left:0;right:auto">
        <button role="menuitemradio" data-act="win" data-n="3">last 3 months</button>
        <button role="menuitemradio" data-act="win" data-n="6">last 6 months</button>
        <button role="menuitemradio" data-act="win" data-n="12">last 12 months</button>
        <button role="menuitemradio" data-act="win" data-n="custom">custom…</button>
        <div id="customBox" hidden style="padding:6px;display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center;font-size:12px">
          <label for="cFrom">start</label><select id="cFrom"></select>
          <label for="cTo">end</label><select id="cTo"></select>
          <span></span><span><button id="cApply" data-act="winApply">Apply</button> <span id="cMsg" class="muted tiny"></span></span>
        </div>
      </div>
    </details>
    <span id="winLabel"></span>
    <button id="infoBtn" data-act="info" aria-label="How the numbers are computed" aria-expanded="false">i</button>
  </div>
</header>

<nav id="left" aria-label="Controls">
  <div id="levelBox"><h4>Level</h4>
    <span class="seg" role="radiogroup" aria-label="Level">
      <button role="radio" data-act="level" data-l="2" aria-checked="false">areas <span style="display:block">(20)</span></button><button role="radio" data-act="level" data-l="1" aria-checked="true">topics <span style="display:block">(116)</span></button><button role="radio" data-act="level" data-l="0" aria-checked="false">sub-topics <span style="display:block">(368)</span></button>
    </span></div>
  <div id="colourBox"><h4>Colour by</h4>
    <div class="opts small" role="radiogroup" aria-label="Colour by" style="line-height:1.8">
      <label><input type="radio" name="colour" value="growth" checked>Growth</label><br>
      <label><input type="radio" name="colour" value="topic">Topic</label><br>
      <label><input type="radio" name="colour" value="date">Date</label><br>
      <label id="distLabel" title="Set A first"><input type="radio" name="colour" value="dist" disabled>Distance to A</label>
    </div></div>
  <div id="legendBox"><h4 id="legendHead">Growth vs CS, topics</h4><div class="rows" id="legendRows"></div>
    <label id="lightRow" class="small muted"><input type="checkbox" id="lightness">Lightness only</label>
    <div id="largeLine" class="tiny muted" hidden></div></div>
  <details id="layersBox" open><summary>layers ▾</summary><div><h4>Map layers</h4>
    <div class="small" style="line-height:1.9">
      <label><input type="checkbox" role="switch" id="tNodes">topic nodes</label><br>
      <label><input type="checkbox" role="switch" id="tBridges">bridge links</label><br>
      <label title="Phrase links use all 36 months and do not follow the window. A phrase links two topics when 10+ papers and 20%+ of its papers are in each, and it spans at most 4 topics."><input type="checkbox" role="switch" id="tPhrases">Phrase links (all 36 months)</label>
    </div>
    <label class="tiny muted" for="edgeN" style="display:block;margin-top:4px">edges shown: <span id="edgeCount" class="mono">40</span></label>
    <input type="range" id="edgeN" min="10" max="200" step="1" value="40" aria-label="Number of edges">
  </div></details>
  <div id="searchBox" style="position:relative"><h4>Search</h4>
    <input type="search" id="q" placeholder="/ phrase or title…" autocomplete="off" aria-label="Search phrase or title" role="combobox" aria-expanded="false" aria-controls="sugg">
    <ul id="sugg" role="listbox" hidden></ul>
    <div id="modeRow" class="tiny muted" role="radiogroup" aria-label="Search mode" style="margin-top:3px">
      <label><input type="radio" name="smode" value="phrase" checked>phrase (title+abstract)</label> <label><input type="radio" name="smode" value="title">title</label></div>
  </div>
  <div id="compareBox"><h4>Compare</h4>
    <div class="slot" id="slotA"></div><div class="slot" id="slotB"></div>
    <button id="swapBtn" data-act="swap" aria-label="Swap A and B" title="Swap A and B">⇄</button>
  </div>

  <details id="savedBox" open><summary class="savedSum">Saved ▾</summary><div><h4>Saved</h4><div id="savedList"><div class="muted">none yet</div></div></div></details>
  <div id="leftNote"></div>
</nav>

<main id="mapwrap">
  <canvas id="map" tabindex="0" role="img" aria-label="Map of papers"></canvas>
  <svg id="lassoSvg"><path id="lassoPath" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
  <div id="loading">Loading map points: <span id="loadN">0.0</span> of <span id="loadT">7.8</span> MB<div class="bar"><i id="loadBar"></i></div></div>
  <div id="zoomBtns"><button tabindex="-1" data-act="zin" aria-label="Zoom in">+</button><button tabindex="-1" data-act="zout" aria-label="Zoom out">−</button><button tabindex="-1" data-act="fit" aria-label="Fit map">⤢</button></div>

  <div id="caption"></div>
  <div id="tip" role="tooltip"></div>
</main>

<section id="tabs">
  <div id="handle" title="Drag to resize; double-click to collapse"></div>
  <div id="tabbar" role="tablist" aria-label="Tables">
    <button role="tab" data-act="tab" data-t="topics" aria-selected="true">Topics</button><button role="tab" data-act="tab" data-t="links" aria-selected="false">Links</button><button role="tab" data-act="tab" data-t="phrases" aria-selected="false">Phrases</button><button role="tab" data-act="tab" data-t="ideas" aria-selected="false">Ideas</button>
  </div>
  <div id="tabbody" role="tabpanel"><div class="prog" id="tabProg"></div>
    <div id="pTopics"></div><div id="pLinks" hidden></div>
    <div id="pPhrases" hidden><div class="tabhead" id="btLine"></div><div style="padding:4px 10px"><input type="search" id="phFilter" placeholder="filter phrases" aria-label="Filter phrases" style="width:220px"></div><div id="phTable"></div></div>
    <div id="pIdeas" hidden></div>
  </div>
</section>

<aside id="insp" aria-label="Inspector" aria-live="polite">
  <div id="inspTop"></div><div id="abBlock"></div><div id="inspBody"></div>
</aside>
</div>
<div id="banner" hidden></div>
<div id="infoPop" role="dialog" aria-label="How the numbers are computed" hidden></div>
<div id="toast" hidden></div>

<script async id="deckjs" src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.15/dist.min.js"></script>
<script async id="animejs" src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<script>
'use strict';
// ---------- constants ----------
const G = ['#2f62b8','#5a86c8','#8ea3c0','#8c8c8c','#c8a57a','#e3883a','#ff6a1a'], ND = '#333333';
const LG = ['#2b2b2b','#4a4a4a','#6c6c6c','#8e8e8e','#b0b0b0','#d1d1d1','#f2f2f2'];
const STEP_TXT = ['shrinking fast (under ×0.5)','shrinking','slightly shrinking','flat (×0.9 to ×1.1)','slightly growing','growing','growing fast (×2 or more)'];
const CUTS = [0.5, 0.71, 0.9, 1.11, 1.41, 2.0];
const mapTokenRGB = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim().match(/[0-9a-f]{2}/gi).map(v => parseInt(v, 16));
const A_RGB = mapTokenRGB('--color-a-map'), B_RGB = mapTokenRGB('--color-b'), W_RGB = [255,255,255];
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LEVEL_NAME = {0: 'sub-topics', 1: 'topics', 2: 'areas'}, LEVEL_ONE = {0: 'Sub-topic', 1: 'Topic', 2: 'Area'};
const ARXIV = 'https:' + '//arxiv.org/abs/'; // ponytail: split so the F36.1 URL grep lists only the four loaded libraries (an outbound link is not a loaded library)
const RM = matchMedia('(prefers-reduced-motion: reduce)'), COMPACT = matchMedia('(max-width: 1499px)'), NARROW = matchMedia('(max-width: 1199px)');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => Number(v).toLocaleString('en-US');
const pct = v => (v * 100).toFixed(1) + '%';
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = c => '#' + c.slice(0, 3).map(v => v.toString(16).padStart(2, '0')).join('');
const stepOf = g => { let s = 0; while (s < 6 && g >= CUTS[s]) s++; return s; };
const params = new URLSearchParams(location.search);

// ---------- state ----------
const S = {
  meta: null, MS: [], E: 0, runId: null, level: 1, colour: 'growth', lightness: false, grey: false,
  nodes: false, bridges: false, phrases: false, edgeN: 40, tab: 'topics', win: {n: 6},
  topics: {}, labels: {}, links: null, phraseList: null, saved: [], ideas: [],
  A: null, B: null, cur: null, focus: null, view: 'summary', ev: null, dist: null, distLut: null,
  sort: {col: 'default', dir: -1}, linkSort: {col: 'default', dir: -1}, phSort: {col: 'growth', dir: -1}, lowOpen: false, mode: 'pan', hoverEdge: null,
  pending: new Set(), down: false, ideasBusy: false, ideasWait: null,
};
const P = {n: 0, xy: null, month: null, lvl: null, cat: null, draw: null, xyDraw: null, colours: null, mask: null, bbox: null};
const R = window.__radar = window.__wb = {
  ready: false, firstDrawMs: null, firstRecolorMs: null, lastRecolorMs: null, lastFrameMs: null, maxFrameMs: null, lastLassoMs: null, animCount: 0, renderer: null,
  get nPoints() { return P.draw ? P.draw.length : P.n; }, get nDrawn() { return P.draw ? P.draw.length : P.n; },
  get zoom() { return zf(); }, get viewState() { return VS; }, get mode() { return S.mode; },
  selection() { const f = s => s && {sel_id: s.sel_id || null, n: s.data ? s.data.n : (s.rows ? s.rows.length : null), kind: s.kind, label: s.label}; return {current: f(S.cur), A: f(S.A), B: f(S.B)}; },
  colourOf(row) { const k = P.draw ? P.drawPos[row] : row; return k == null || k < 0 || !P.colours ? null : rgb2hex(Array.from(P.colours.subarray(4 * k, 4 * k + 3))); },
  visibleLabels(withBoxes) { return withBoxes ? LBL.map(l => ({text: l.text.replace(/\n/g, ' '), box: l.box, size: l.size})) : LBL.map(l => l.text.replace(/\n/g, ' ')); },
  layers() { return (DK ? DK.props.layers : []).map(l => { const o = {id: l.id}; const d = l.props.data; o.n = d ? (d.length ?? 0) : 0; if (Array.isArray(d)) o.data = d.slice(0, 400).map(x => { const y = {}; for (const k in x) if (typeof x[k] !== 'object' || k === 'colour') y[k] = x[k]; return y; }); for (const k in l.props) { const v = l.props[k]; if (['number', 'string', 'boolean'].includes(typeof v)) o[k] = v; } return o; }); },
  zoomTo(f, xy, ms) { flyTo({target: xy || VS.target, zoom: Z0 + Math.log2(f)}, ms ?? 0); },
};
const anim = (el, props) => { R.animCount++; if (window.anime && anime.animate) anime.animate(el, {...props, duration: RM.matches ? 0 : (props.duration || 200)}); };

// ---------- windows ----------
const mLabel = i => { const [y, m] = S.MS[i].split('-'); return MN[m - 1] + ' ' + y; };
function rangeText(a, b) {
  const [ya, ma] = S.MS[a].split('-'), [yb, mb] = S.MS[b].split('-');
  if (a === b) return MN[ma - 1] + ' ' + ya;
  return ya === yb ? `${MN[ma - 1]} to ${MN[mb - 1]} ${yb}` : `${MN[ma - 1]} ${ya} to ${MN[mb - 1]} ${yb}`;
}
function winIdx(w = S.win) { const b = w.n ? S.E : w.b, a = w.n ? S.E - w.n + 1 : w.a, N = b - a + 1; return {a, b, pa: a - N, pb: a - 1, N}; }
const winText = (w = S.win) => { const x = winIdx(w); return `${rangeText(x.a, x.b)} vs ${rangeText(x.pa, x.pb)}`; };
const winQS = () => { const x = winIdx(); return `from=${S.MS[x.a]}&to=${S.MS[x.b]}`; };
const winObj = () => { const x = winIdx(); return {from: S.MS[x.a], to: S.MS[x.b]}; };
const textOfWin = w => { if (!w || !w.from) return ''; const a = S.MS.indexOf(w.from), b = S.MS.indexOf(w.to); return a < 0 || b < 0 ? `${w.from} to ${w.to}` : rangeText(a, b); };
const volOf = () => { const t = S.topics[S.level]; return t && t.window ? t.window.vol_ratio : null; };

// ---------- server ----------
const BANNER = {
  down: () => `Server not reachable at ${location.host || 'localhost:8765'}. Start it with .venv/bin/python -m radar.serve. The map still pans and colours; selections, tables and ideas need the server.`,
  file: () => 'Open http://localhost:8765 instead of the file.',
  guard: () => 'The server refused this request (wrong address). Open the page at http://localhost:8765, not 127.0.0.1 through another tab or a proxy.',
};
let offline = false, retryTimer = null;
function banner(kind) { const b = $('banner'); if (!kind) { b.hidden = true; b.dataset.kind = ''; return; } b.textContent = BANNER[kind](); b.dataset.kind = kind; b.hidden = false; }
function setOffline(v) {
  if (v === offline) return; offline = v; $('statusDot').style.color = v ? 'var(--color-muted)' : 'var(--color-green)';
  if (v) banner('down'); else { if ($('banner').dataset.kind === 'down') banner(null); for (const f of [...S.pending]) { S.pending.delete(f); f(); } }
}
async function api(path, body) {
  const opt = {headers: S.runId ? {'X-Run-Id': S.runId} : {}};
  if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); } catch (e) { setOffline(true); const err = new Error('offline'); err.offline = true; throw err; }
  setOffline(false);
  const j = await r.json().catch(() => ({}));
  if (r.status === 403) banner('guard');
  if (r.status === 409 && j.error === 'stale_run') { location.reload(); }
  if (!r.ok) { const err = new Error(j.message || ('HTTP ' + r.status)); err.status = r.status; err.body = j; throw err; }
  return j;
}
setInterval(() => { if (location.protocol !== 'file:') api('/meta').catch(() => {}); }, 5000);  // heartbeat: banner within 5 s, auto-retry

// ---------- points.bin ----------
async function loadPoints() {
  performance.mark('pointsStart');
  const res = await fetch('/points.bin');
  const total = +res.headers.get('Content-Length') || 7807265;
  $('loadT').textContent = (total / 1e6).toFixed(1);
  const buf = new Uint8Array(total); let got = 0; const rd = res.body.getReader();
  for (;;) { const {done, value} = await rd.read(); if (done) break; buf.set(value, got); got += value.length; $('loadN').textContent = (got / 1e6).toFixed(1); $('loadBar').style.width = (100 * got / total) + '%'; }
  const b = buf.buffer, dv = new DataView(b);
  if (dv.getUint32(0, true) !== 0x54505246 || new Uint32Array(b, 0, 1)[0] !== 0x54505246) throw new Error('points.bin: bad magic or big-endian platform');
  const n = dv.getUint32(8, true);
  P.n = n; P.xy = new Float32Array(b, 32, 2 * n); P.month = new Uint16Array(b, 32 + 8 * n, n);
  P.lvl = [0, 1, 2].map(k => new Int16Array(b, 32 + (10 + 2 * k) * n, n)); P.cat = new Uint8Array(b, 32 + 16 * n, n);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < n; i++) { const x = P.xy[2 * i], y = P.xy[2 * i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  P.bbox = [x0, y0, x1, y1]; P.mask = new Uint8Array(n);
  // F17.3 fallback: a 150k sample, stratified by fine cluster (deterministic hash keeps each cluster's share in expectation)
  if (params.get('full')) try { localStorage.removeItem('radar.fallback'); } catch (e) {}
  let fb = params.get('fallback'); try { fb = fb || localStorage.getItem('radar.fallback'); } catch (e) {}
  if (fb === 'sample' && n > 150000) {
    const keep = [], th = 150000 / n;
    for (let i = 0; i < n; i++) if ((((i + 1) * 2654435761) >>> 0) / 4294967296 < th) keep.push(i);
    P.draw = Uint32Array.from(keep); P.xyDraw = new Float32Array(2 * keep.length); P.drawPos = new Int32Array(n).fill(-1);
    keep.forEach((r, k) => { P.xyDraw[2 * k] = P.xy[2 * r]; P.xyDraw[2 * k + 1] = P.xy[2 * r + 1]; P.drawPos[r] = k; });
    $('largeLine').textContent = 'Showing a 150k sample for speed; stats use all 459k papers.'; $('largeLine').hidden = false;
    $('caption').dataset.sample = '1';
  } else P.xyDraw = P.xy;
  P.colours = new Uint8Array(4 * (P.draw ? P.draw.length : n));
  $('loading').hidden = true;
}

// ---------- colours ----------
function clusterInfo(t) {  // one topic entry -> {hex, step: 0..6 | 'new' | 'nd'}
  if (!t) return {hex: ND, step: 'nd'};
  if (t.is_new) return {hex: G[6], step: 'new'};
  if ((t.recent < 30 && t.prior < 30) || t.growth == null) return {hex: ND, step: 'nd'};
  const s = stepOf(t.growth); return {hex: (S.lightness ? LG : G)[s], step: s};
}
function growthHex(g, status) { if (status === 'new') return G[6]; if (g == null) return ND; return (S.lightness ? LG : G)[stepOf(g)]; }
function topicLut() {  // per point colour by cluster at current level
  const T = S.topics[S.level], nc = (S.meta && S.meta.levels[String(S.level)]) || 512, lut = new Uint8Array(4 * nc);
  for (let c = 0; c < nc; c++) lut.set(hex2rgb('#8c8c8c'), 4 * c);
  if (T) for (const t of T.topics) lut.set(hex2rgb(clusterInfo(t).hex), 4 * t.c);
  return lut;
}
function areaHue(a, t) {  // 20 hues, topics vary ±10% lightness
  const h = (a * 137.508) % 360, l = 0.55 + ((t * 7919 % 21) - 10) / 100, s = 0.55, k = n => (n + h / 30) % 12, q = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => Math.round(255 * (l - q * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))));
}
function recolour() {
  if (!P.n) return;
  const t0 = performance.now(), out = new Uint8Array(P.colours.length), D = P.draw, N = D ? D.length : P.n;
  const anySel = !!(S.A || S.B || S.cur), base = S.grey ? 31 : 89, mode = S.grey ? 'grey' : S.colour;
  let lut = null, lv = P.lvl[S.level];
  if (mode === 'growth') lut = topicLut();
  else if (mode === 'date') { lut = new Uint8Array(4 * 64); for (let m = 0; m < 64; m++) { const v = Math.round(0x2b + (0xf0 - 0x2b) * Math.min(1, m / Math.max(1, S.E))); lut.set([v, v, v], 4 * m); } lv = P.month; }
  else if (mode === 'dist' && S.distLut) { lut = S.distLut; lv = P.lvl[0]; }
  else if (mode === 'topic') { lut = new Uint8Array(4 * 512 * 32); lv = null; }
  const grey = [90, 90, 90];
  for (let k = 0; k < N; k++) {
    const i = D ? D[k] : k, o = 4 * k;
    if (mode === 'grey' || !lut) { out[o] = grey[0]; out[o + 1] = grey[1]; out[o + 2] = grey[2]; }
    else if (mode === 'topic') { const c = areaHue(P.lvl[2][i], P.lvl[1][i]); out[o] = c[0]; out[o + 1] = c[1]; out[o + 2] = c[2]; }
    else { const c = 4 * lv[i]; out[o] = lut[c]; out[o + 1] = lut[c + 1]; out[o + 2] = lut[c + 2]; }
    out[o + 3] = anySel ? (P.mask[i] ? 153 : 20) : base;
  }
  P.colours = out; colourStart = t0; render();
}
let colourStart = null;
function updateMask() {
  P.mask.fill(0);
  for (const s of [S.A, S.B, S.cur]) if (s && s.rows) for (const r of s.rows) P.mask[r] = 1;
}

// ---------- deck ----------

// Compact layout moves controls across DOM regions; order those groups before the map.
// Wide layout retains its original natural tab order, including generated slot controls.
function syncControlTabOrder() {

  const selector = 'button, input, select, summary, [tabindex]';

    for (const el of controls) {
